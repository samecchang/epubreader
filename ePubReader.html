<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EPUB Reader</title>
<script src="jquery-3.7.1.min.js"></script>
<script src="turn.min.js"></script>
<style>
:root{--bg:#e8e0d0;--page:#faf6ed;--text:#2a2520;--ui:#5a4e42;--ui-hover:#3a3228;--accent:#8b7355;--fs:18px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);font-family:Georgia,"Times New Roman",serif;color:var(--text)}

/* Overlay */
#overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .4s}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{font-size:28px;color:var(--ui);margin-bottom:12px;font-weight:400}
#overlay p{color:var(--accent);font-size:15px;margin-bottom:24px}
#overlay .pick-btn{display:inline-block;padding:14px 32px;background:var(--ui);color:#fff;border-radius:10px;font-size:16px;cursor:pointer;border:none;transition:background .15s}
#overlay .pick-btn:hover{background:var(--ui-hover)}
#fileInput{display:none}
#loadStatus{margin-top:16px;font-size:14px;color:var(--accent)}

/* Book container */
#book{position:fixed;inset:0;display:none;align-items:center;justify-content:center}
#book.show{display:flex}

/* Flipbook (turn.js) */
.flipbook{position:relative;background:var(--bg)}
.flipbook .page{background:var(--page);overflow:hidden}
.flipbook .shadow{box-shadow:0 0 20px rgba(0,0,0,.15)}

/* Page content inside turn.js pages */
.pg-wrap{width:100%;height:100%;padding:30px 32px;box-sizing:border-box}
.pg-clip{overflow:hidden;width:100%;height:100%}
.pg-inner{line-height:1.7;column-fill:auto;column-gap:0;width:100%;height:100%;user-select:text;-webkit-user-select:text}
.pg-inner .spine-item{break-before:column}
.pg-inner img{max-width:100%;height:auto}
.pg-inner h1,.pg-inner h2,.pg-inner h3{margin:0.5em 0 0.3em;line-height:1.3}
.pg-inner p{margin:0 0 0.6em;text-align:justify}

/* Controls */
#controls{position:fixed;bottom:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 16px;background:rgba(90,78,66,.85);backdrop-filter:blur(6px);transition:opacity .4s;opacity:0}
#controls.show{opacity:1}
#controls button{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 14px;border-radius:8px;font-size:14px;cursor:pointer;transition:background .15s}
#controls button:hover{background:rgba(255,255,255,.12)}
#pageInfo{color:rgba(255,255,255,.7);font-size:13px;min-width:90px;text-align:center}
#controls .sep{width:1px;height:20px;background:rgba(255,255,255,.15);margin:0 4px}
#progressBar{width:120px;height:4px;accent-color:#fff;cursor:pointer;vertical-align:middle}

/* Dark mode */
body.dark{--bg:#1a1a1e;--page:#252528;--text:#d4cfc8;--ui:#888;--accent:#777}

/* Screen reader */
#sr-info{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>

<div id="overlay">
  <h1>EPUB Reader</h1>
  <p>Open a local .epub file to start reading</p>
  <label class="pick-btn" for="fileInput">Choose EPUB File</label>
  <input type="file" id="fileInput" accept=".epub"/>
  <div id="loadStatus"></div>
</div>

<div id="book">
  <div class="flipbook" id="flipbook"></div>
</div>

<div id="controls">
  <button id="btnPrev">&#9664; Prev</button>
  <span id="pageInfo">&ndash;</span>
  <button id="btnNext">Next &#9654;</button>
  <input type="range" id="progressBar" min="1" max="1" value="1"/>
  <div class="sep"></div>
  <button id="btnFontDec">A&minus;</button>
  <button id="btnFontInc">A+</button>
  <div class="sep"></div>
  <button id="btnDark">&#9790;</button>
</div>
<div id="sr-info" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ── State ── */
var $fb = null;
var totalPages = 0;
var pageW = 0, pageH = 0, colW = 0;
var pageEls = [];
var fontSize = 18;
var isSingle = false;
var isDark = false;
var allContent = '';
var epubData = null;
var controlsTimer = null;

/* ================================================================
   ZIP PARSER
   ================================================================ */
async function readZip(arrayBuffer){
  var bytes = new Uint8Array(arrayBuffer);
  var files = {};
  var eocdOffset = -1;
  for(var i = bytes.length - 22; i >= 0 && i >= bytes.length - 65557; i--){
    if(bytes[i]===0x50 && bytes[i+1]===0x4b && bytes[i+2]===0x05 && bytes[i+3]===0x06){
      eocdOffset = i; break;
    }
  }
  if(eocdOffset < 0) throw new Error('Not a valid ZIP/EPUB file');
  var view = new DataView(arrayBuffer);
  var cdOffset = view.getUint32(eocdOffset + 16, true);
  var cdEntries = view.getUint16(eocdOffset + 10, true);
  var pos = cdOffset;
  for(var e = 0; e < cdEntries; e++){
    if(view.getUint32(pos, true) !== 0x02014b50) break;
    var method     = view.getUint16(pos + 10, true);
    var compSize   = view.getUint32(pos + 20, true);
    var nameLen    = view.getUint16(pos + 28, true);
    var extraLen   = view.getUint16(pos + 30, true);
    var commentLen = view.getUint16(pos + 32, true);
    var localOff   = view.getUint32(pos + 42, true);
    var name = new TextDecoder().decode(bytes.subarray(pos + 46, pos + 46 + nameLen));
    pos += 46 + nameLen + extraLen + commentLen;
    if(name.endsWith('/')) continue;
    var lNameLen  = view.getUint16(localOff + 26, true);
    var lExtraLen = view.getUint16(localOff + 28, true);
    var dataStart = localOff + 30 + lNameLen + lExtraLen;
    var rawData   = bytes.subarray(dataStart, dataStart + compSize);
    if(method === 0){
      files[name] = rawData.slice();
    } else if(method === 8){
      try { files[name] = await inflateData(rawData); }
      catch(err){ console.warn('Decompress fail:', name, err); }
    }
  }
  return files;
}
async function inflateData(compressedBytes){
  var ds = new DecompressionStream('deflate-raw');
  var writer = ds.writable.getWriter();
  writer.write(compressedBytes); writer.close();
  var reader = ds.readable.getReader();
  var chunks = [], result;
  while(true){ result = await reader.read(); if(result.done) break; chunks.push(result.value); }
  var totalLen = 0;
  for(var c = 0; c < chunks.length; c++) totalLen += chunks[c].length;
  var out = new Uint8Array(totalLen), off = 0;
  for(var c = 0; c < chunks.length; c++){ out.set(chunks[c], off); off += chunks[c].length; }
  return out;
}
function fileAsText(files, path){
  if(!files[path]) return '';
  return new TextDecoder().decode(files[path]);
}
function fileAsDataURL(files, path){
  if(!files[path]) return '';
  var ext = path.split('.').pop().toLowerCase();
  var mime = {jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',svg:'image/svg+xml',webp:'image/webp'}[ext] || 'application/octet-stream';
  return 'data:' + mime + ';base64,' + uint8ToBase64(files[path]);
}
function uint8ToBase64(u8){
  var str = '';
  for(var i = 0; i < u8.length; i++) str += String.fromCharCode(u8[i]);
  return btoa(str);
}

/* ================================================================
   EPUB PARSER
   ================================================================ */
async function parseEpub(arrayBuffer){
  loadStatus.textContent = 'Extracting files...';
  var files = await readZip(arrayBuffer);
  loadStatus.textContent = 'Parsing structure...';
  var containerXml = fileAsText(files, 'META-INF/container.xml');
  if(!containerXml) throw new Error('Missing container.xml');
  var opfMatch = containerXml.match(/full-path="([^"]+)"/);
  if(!opfMatch) throw new Error('Cannot find OPF path');
  var opfPath = opfMatch[1];
  var opfDir = opfPath.substring(0, opfPath.lastIndexOf('/') + 1);
  var opfXml = fileAsText(files, opfPath);
  if(!opfXml) throw new Error('Cannot read OPF file');
  var parser = new DOMParser();
  var opfDoc = parser.parseFromString(opfXml, 'application/xml');
  var manifest = {};
  var items = opfDoc.querySelectorAll('manifest > item');
  for(var i = 0; i < items.length; i++){
    var id = items[i].getAttribute('id');
    var href = items[i].getAttribute('href');
    var media = items[i].getAttribute('media-type') || '';
    manifest[id] = { href: opfDir + href, media: media };
  }
  var spine = [];
  var spineItems = opfDoc.querySelectorAll('spine > itemref');
  for(var j = 0; j < spineItems.length; j++){
    var idref = spineItems[j].getAttribute('idref');
    if(manifest[idref]) spine.push(manifest[idref].href);
  }
  var titleEl = opfDoc.querySelector('metadata > *|title');
  var title = titleEl ? titleEl.textContent : 'Untitled';
  return { spine: spine, manifest: manifest, files: files, opfDir: opfDir, title: title };
}

/* ================================================================
   CONTENT RENDERING
   ================================================================ */
function renderSpineItem(epub, href){
  var html = fileAsText(epub.files, href);
  if(!html) return '';
  var itemDir = href.substring(0, href.lastIndexOf('/') + 1);
  var parser = new DOMParser();
  var doc = parser.parseFromString(html, 'application/xhtml+xml');
  if(doc.querySelector('parsererror')) doc = parser.parseFromString(html, 'text/html');
  var scripts = doc.querySelectorAll('script');
  for(var i = 0; i < scripts.length; i++) scripts[i].remove();
  var imgs = doc.querySelectorAll('img, image');
  for(var j = 0; j < imgs.length; j++){
    var src = imgs[j].getAttribute('src') || imgs[j].getAttributeNS('http://www.w3.org/1999/xlink', 'href') || '';
    if(src && !src.startsWith('data:')){
      var resolved = resolvePath(itemDir, src);
      var dataUrl = fileAsDataURL(epub.files, resolved);
      if(imgs[j].tagName === 'image') imgs[j].setAttributeNS('http://www.w3.org/1999/xlink', 'href', dataUrl);
      else imgs[j].setAttribute('src', dataUrl);
    }
  }
  var body = doc.querySelector('body');
  return body ? body.innerHTML : doc.documentElement.innerHTML;
}
function resolvePath(base, rel){
  if(rel.startsWith('/')) return rel.substring(1);
  var parts = base.split('/'); parts.pop();
  var relParts = rel.split('/');
  for(var i = 0; i < relParts.length; i++){
    if(relParts[i] === '..') parts.pop();
    else if(relParts[i] !== '.') parts.push(relParts[i]);
  }
  return parts.join('/');
}

/* ================================================================
   PAGINATION — measure pages via CSS columns
   ================================================================ */
function getPageWidth(){
  return isSingle ? window.innerWidth : Math.floor(window.innerWidth / 2);
}

function measurePages(){
  pageW = getPageWidth();
  pageH = window.innerHeight;
  colW = Math.max(50, pageW - 64);
  var ch = Math.max(50, pageH - 60);
  var m = document.createElement('div');
  m.style.cssText = 'position:absolute;left:-9999px;top:0;width:'+colW+'px;height:'+ch+'px;overflow:hidden;font-size:'+fontSize+'px;line-height:1.7;column-fill:auto;column-width:'+colW+'px;column-gap:0';
  m.innerHTML = allContent;
  document.body.appendChild(m);
  m.offsetHeight;
  totalPages = Math.max(1, Math.round(m.scrollWidth / colW));
  m.parentNode.removeChild(m);
  if(!isSingle && totalPages % 2 !== 0) totalPages++;
}

/* ================================================================
   TURN.JS INTEGRATION
   ================================================================ */
function fillPage(el, idx){
  if(!el || idx < 0 || idx >= totalPages) return;
  if(el._pgIdx === idx && el._pgFS === fontSize) return;
  el._pgIdx = idx;
  el._pgFS = fontSize;
  el.innerHTML = '<div class="pg-wrap"><div class="pg-clip"><div class="pg-inner" style="font-size:'+fontSize+'px;column-width:'+colW+'px;transform:translateX(-'+(idx*colW)+'px)">'+allContent+'</div></div></div>';
}
function clearPage(el){
  if(!el) return;
  el._pgIdx = -1;
  el._pgFS = -1;
  el.innerHTML = '';
}

function populateAround(page){
  var r = 4;
  for(var i = 0; i < totalPages; i++){
    var tp = i + 1;
    if(tp >= page - r && tp <= page + r) fillPage(pageEls[i], i);
  }
}
function clearFar(page){
  var r = 6;
  for(var i = 0; i < totalPages; i++){
    var tp = i + 1;
    if(tp < page - r || tp > page + r) clearPage(pageEls[i]);
  }
}

function buildFlipbook(){
  $fb = $('#flipbook').empty();
  pageEls = [];
  var frag = document.createDocumentFragment();
  for(var i = 0; i < totalPages; i++){
    var d = document.createElement('div');
    pageEls.push(d);
    frag.appendChild(d);
  }
  $fb.append(frag);
  var bw = isSingle ? pageW : pageW * 2;
  $fb.turn({
    width: bw,
    height: pageH,
    display: isSingle ? 'single' : 'double',
    acceleration: true,
    gradients: true,
    elevation: 50,
    duration: 600,
    when: {
      turning: function(e, page){ populateAround(page); },
      turned: function(e, page){
        updateToolbar(page);
        populateAround(page);
        clearFar(page);
        try{ localStorage.setItem('epub_page', page); }catch(x){}
      }
    }
  });
  populateAround(1);
  updateToolbar(1);
}

function destroyFlipbook(){
  if($fb){
    try{ $fb.turn('destroy'); }catch(x){}
    $fb.empty().removeAttr('style');
    $fb = null;
  }
  pageEls = [];
}

/* ================================================================
   TOOLBAR
   ================================================================ */
function updateToolbar(page){
  if(isSingle){
    $('#pageInfo').text(page + ' / ' + totalPages);
  } else {
    var view = $fb ? $fb.turn('view') : [0,0];
    var l = view[0] || 0, r = view[1] || 0;
    var txt = '';
    if(l && r) txt = l + '\u2013' + r;
    else if(l) txt = '' + l;
    else if(r) txt = '' + r;
    $('#pageInfo').text(txt + ' / ' + totalPages);
  }
  $('#progressBar').prop({max: totalPages, value: page});
  $('#sr-info').text('Page ' + page + ' of ' + totalPages);
}

/* ================================================================
   NAVIGATION
   ================================================================ */
$('#btnPrev').on('click', function(){ if($fb) $fb.turn('previous'); });
$('#btnNext').on('click', function(){ if($fb) $fb.turn('next'); });

$('#progressBar').on('input', function(){
  var v = parseInt(this.value) || 1;
  if($fb) $fb.turn('page', Math.max(1, Math.min(totalPages, v)));
});

$(document).on('keydown', function(e){
  if(!$fb) return;
  if(e.key === 'ArrowRight' || e.key === 'PageDown'){ $fb.turn('next'); showControls(); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ $fb.turn('previous'); showControls(); }
  else if(e.key === '+' || e.key === '=') changeFontSize(2);
  else if(e.key === '-') changeFontSize(-2);
});

/* ================================================================
   FONT SIZE
   ================================================================ */
function changeFontSize(delta){
  fontSize = Math.max(10, Math.min(40, fontSize + delta));
  document.documentElement.style.setProperty('--fs', fontSize + 'px');
  repaginate();
}
$('#btnFontDec').on('click', function(){ changeFontSize(-2); });
$('#btnFontInc').on('click', function(){ changeFontSize(2); });

function repaginate(){
  if(!allContent) return;
  var curPage = 1, ratio = 0;
  if($fb){
    try{
      curPage = $fb.turn('page');
      ratio = curPage / Math.max(1, totalPages);
    }catch(x){}
  }
  destroyFlipbook();
  measurePages();
  buildFlipbook();
  if(ratio > 0){
    var np = Math.max(1, Math.min(totalPages, Math.round(ratio * totalPages)));
    try{ $fb.turn('page', np); }catch(x){}
  }
  try{ localStorage.setItem('epub_fs', fontSize); }catch(x){}
}

/* ================================================================
   DARK MODE
   ================================================================ */
$('#btnDark').on('click', function(){
  isDark = !isDark;
  $('body').toggleClass('dark', isDark);
  $(this).text(isDark ? '\u2600' : '\u263E');
  try{ localStorage.setItem('epub_dark', isDark ? '1' : '0'); }catch(x){}
});

/* ================================================================
   CONTROLS VISIBILITY
   ================================================================ */
var $controls = $('#controls');
function showControls(){
  $controls.addClass('show');
  clearTimeout(controlsTimer);
  controlsTimer = setTimeout(function(){ $controls.removeClass('show'); }, 3500);
}
$(document).on('mousemove', showControls);
document.addEventListener('touchstart', showControls, {passive:true});

/* ================================================================
   TOUCH SUPPORT — bridge touch→mouse & swipe/tap fallback
   ================================================================ */
var touchX = 0, touchY = 0, touchT = 0, touchDragging = false;

function _handleTapSwipe(t){
  if(!t || !$fb) return;
  var dx = t.clientX - touchX, dy = t.clientY - touchY, dt = Date.now() - touchT;
  /* Swipe: fast horizontal > 50px */
  if(dt < 400 && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5){
    setTimeout(function(){
      if($fb && !$fb.turn('animating')){
        if(dx < 0) $fb.turn('next'); else $fb.turn('previous');
      }
      showControls();
    }, 60);
    return;
  }
  /* Tap: quick, minimal movement — left/right edge turns page, middle shows controls */
  if(dt < 300 && Math.abs(dx) < 15 && Math.abs(dy) < 15){
    setTimeout(function(){
      if(!$fb) return;
      var w = window.innerWidth;
      if(!$fb.turn('animating')){
        if(t.clientX < w * 0.3){ $fb.turn('previous'); showControls(); }
        else if(t.clientX > w * 0.7){ $fb.turn('next'); showControls(); }
        else showControls();
      } else {
        showControls();
      }
    }, 150);
  }
}

if(!$.isTouch){
  /* Desktop: turn.js uses mouse events — bridge touch→mouse for drag-to-flip */
  function _dispatchMouse(t, type){
    t.target.dispatchEvent(new MouseEvent(type, {
      bubbles:true, cancelable:true, view:window,
      screenX:t.screenX, screenY:t.screenY,
      clientX:t.clientX, clientY:t.clientY
    }));
  }
  $(document).on('touchstart', '#flipbook', function(e){
    if(e.originalEvent.touches.length !== 1) return;
    var t = e.originalEvent.touches[0];
    touchX = t.clientX; touchY = t.clientY; touchT = Date.now();
    touchDragging = true;
    _dispatchMouse(t, 'mouseover');
    _dispatchMouse(t, 'mousedown');
  });
  document.addEventListener('touchmove', function(e){
    if(!touchDragging) return;
    e.preventDefault();
    var t = e.changedTouches[0];
    if(t) _dispatchMouse(t, 'mousemove');
  }, {passive:false});
  $(document).on('touchend touchcancel', function(e){
    if(!touchDragging) return;
    touchDragging = false;
    var t = e.originalEvent.changedTouches[0];
    if(t){
      _dispatchMouse(t, 'mouseup');
      _dispatchMouse(t, 'mouseout');
    }
    _handleTapSwipe(t);
  });
} else {
  /* Touch device: turn.js handles corner-drag natively — add swipe/tap */
  $(document).on('touchstart', '#flipbook', function(e){
    if(e.originalEvent.touches.length !== 1) return;
    var t = e.originalEvent.touches[0];
    touchX = t.clientX; touchY = t.clientY; touchT = Date.now();
  });
  $(document).on('touchend', '#flipbook', function(e){
    _handleTapSwipe(e.originalEvent.changedTouches[0]);
  });
}

/* ================================================================
   RESIZE
   ================================================================ */
var resizeTimer;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    isSingle = window.innerWidth < 700;
    if(allContent) repaginate();
  }, 250);
});

/* ================================================================
   LOAD EPUB
   ================================================================ */
var $loadStatus = $('#loadStatus');
var loadStatus = $loadStatus[0];
$('#fileInput').on('change', async function(){
  var file = this.files[0];
  if(!file) return;
  $loadStatus.text('Reading file...');
  try {
    var ab = await file.arrayBuffer();
    epubData = await parseEpub(ab);
    $loadStatus.text('Rendering content...');

    allContent = '';
    for(var i = 0; i < epubData.spine.length; i++){
      var html = renderSpineItem(epubData, epubData.spine[i]);
      allContent += '<div class="spine-item">' + html + '</div>';
    }

    document.title = epubData.title + ' \u2014 EPUB Reader';
    isSingle = window.innerWidth < 700;
    $('#overlay').addClass('hidden');
    $('#book').addClass('show');

    /* Restore settings */
    try{
      var sfs = parseInt(localStorage.getItem('epub_fs')) || 18;
      if(sfs >= 10 && sfs <= 40) fontSize = sfs;
      document.documentElement.style.setProperty('--fs', fontSize + 'px');
      if(localStorage.getItem('epub_dark') === '1'){
        isDark = true;
        $('body').addClass('dark');
        $('#btnDark').text('\u2600');
      }
    }catch(x){}

    measurePages();
    buildFlipbook();

    /* Restore page position */
    try{
      var sp = parseInt(localStorage.getItem('epub_page')) || 1;
      if(sp > 1 && sp <= totalPages) $fb.turn('page', sp);
    }catch(x){}

    showControls();

  } catch(err){
    console.error(err);
    $loadStatus.text('Error: ' + (err.message || 'Failed to load'));
  }
});

})();
</script>
</body>
</html>
