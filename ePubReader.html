<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ePub Reader</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1a1a2e;--surface:#16213e;--border:rgba(255,255,255,.08);--accent:#4fc3f7;--text:#e0e0e0;--muted:#78909c;--page-fs:18px}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:20;flex-shrink:0}
.tg{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:6px 12px;display:flex;align-items:center;gap:6px}
.tg label{font-size:11px;color:var(--muted);white-space:nowrap}
.tg input[type=file]{max-width:200px;font-size:12px;color:var(--text)}
.tg input[type=range]{width:100px;accent-color:var(--accent)}
.tg input[type=number]{width:56px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:6px;padding:4px 6px;color:var(--text);font-size:12px;text-align:center}
.btn{background:var(--accent);color:#0a1628;border:none;border-radius:6px;padding:4px 10px;font-weight:700;font-size:12px;cursor:pointer}
.btn-g{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--border);cursor:pointer;border-radius:6px;padding:3px 8px;font-size:14px}
.spacer{flex:1}
main{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;padding:12px}
#book-viewport{width:100%;max-width:1100px;height:100%;background:#fdfdfe;border-radius:6px;overflow:hidden;position:relative;box-shadow:0 8px 40px rgba(0,0,0,.5);padding:32px 40px}
#book-content{height:100%;column-gap:48px;color:#1e293b;font-size:var(--page-fs);line-height:1.75;overflow:hidden;position:relative}
#book-content::-webkit-scrollbar{display:none}
#book-content{scrollbar-width:none}
#book-content .chapter-break{break-before:column}
#book-content img{max-width:100%;height:auto}
#book-content h1,#book-content h2,#book-content h3{break-after:avoid}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:none;background:rgba(0,0,0,.15);color:#fff;font-size:18px;cursor:pointer;z-index:10;display:none;backdrop-filter:blur(4px)}
.nav:hover{background:rgba(0,0,0,.3)}
#prevBtn{left:16px}
#nextBtn{right:16px}
#splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#78909c;z-index:5;background:#fdfdfe;border-radius:6px}
#splash .ico{font-size:48px;opacity:.3}
footer{background:var(--surface);border-top:1px solid var(--border);padding:6px 16px;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);flex-shrink:0}
#bookTitle{color:var(--text);font-weight:600;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="tg"><label>Open</label><input type="file" id="fileInput" accept=".epub"/></div>
  <div class="tg">
    <label>Page</label>
    <input type="range" id="slider" min="1" max="1" value="1" disabled/>
    <input type="number" id="pageNum" min="1" value="1" disabled/>
    <span id="pageTotal" style="font-size:12px;color:var(--muted)">/ 0</span>
    <button class="btn" id="goBtn" disabled>Go</button>
  </div>
  <div class="tg">
    <label>Font</label>
    <button class="btn-g" id="fontDec">A-</button>
    <input type="range" id="fontSlider" min="12" max="32" value="18"/>
    <button class="btn-g" id="fontInc">A+</button>
    <span id="fontLbl" style="font-size:11px;color:var(--muted);min-width:24px;text-align:center">18</span>
  </div>
  <span class="spacer"></span>
  <span id="info" style="font-size:12px;color:var(--muted)"></span>
</header>
<main>
  <div id="book-viewport">
    <div id="splash"><div class="ico">&#128214;</div><p>Select an <b>.epub</b> file to begin</p></div>
    <div id="book-content"></div>
  </div>
  <button class="nav" id="prevBtn">&#9664;</button>
  <button class="nav" id="nextBtn">&#9654;</button>
</main>
<footer>
  <span id="bookTitle">No book loaded</span>
  <span class="spacer"></span>
  <span id="pageIndicator">Page 0 / 0</span>
  <span id="statusMsg"></span>
</footer>
<script src="jszip.min.js"></script>
<script>
(function(){
"use strict";
var fontSize=18,currentCol=0,totalCols=0,animating=false,rawHTML='';
var fileInput=document.getElementById('fileInput'),slider=document.getElementById('slider'),
pageNumIn=document.getElementById('pageNum'),pageTotalS=document.getElementById('pageTotal'),
goBtn=document.getElementById('goBtn'),fontDec=document.getElementById('fontDec'),
fontInc=document.getElementById('fontInc'),fontSliderEl=document.getElementById('fontSlider'),
fontLbl=document.getElementById('fontLbl'),prevBtn=document.getElementById('prevBtn'),
nextBtn=document.getElementById('nextBtn'),viewport=document.getElementById('book-viewport'),
content=document.getElementById('book-content'),splash=document.getElementById('splash'),
bookTitleE=document.getElementById('bookTitle'),
pageIndic=document.getElementById('pageIndicator'),statusMsg=document.getElementById('statusMsg');

var MIME={'.jpg':'image/jpeg','.jpeg':'image/jpeg','.png':'image/png','.gif':'image/gif','.svg':'image/svg+xml','.webp':'image/webp'};
function getExt(p){var m=/\.\w+$/.exec(p||'');return m?m[0].toLowerCase():'';}
function resolve(base,rel){
  if(/^(https?:|data:)/i.test(rel))return rel;
  var bp=base.split('/');bp.pop();
  rel.split('/').forEach(function(s){if(s==='..')bp.pop();else if(s&&s!=='.')bp.push(s);});
  return bp.join('/');
}

async function inlineImgs(doc,zip,path){
  var imgs=doc.querySelectorAll('img,image');
  for(var i=0;i<imgs.length;i++){
    var el=imgs[i],attr=el.hasAttribute('src')?'src':'href';
    var src=el.getAttribute(attr);if(!src||src.startsWith('data:'))continue;
    var abs=resolve(path,src),f=zip.file(abs)||zip.file(decodeURIComponent(abs));
    if(!f)continue;
    el.setAttribute(attr,'data:'+(MIME[getExt(abs)]||'application/octet-stream')+';base64,'+await f.async('base64'));
  }
}

async function parseEpub(buf){
  var zip=await JSZip.loadAsync(buf),P=new DOMParser();
  var cDoc=P.parseFromString(await zip.file('META-INF/container.xml').async('string'),'application/xml');
  var rf=cDoc.querySelector('rootfile');if(!rf)throw new Error('Invalid ePub');
  var opfPath=rf.getAttribute('full-path');
  var opf=P.parseFromString(await zip.file(opfPath).async('string'),'application/xml');
  var title=(opf.querySelector('title')||{}).textContent||'Untitled';
  var manifest={};
  opf.querySelectorAll('item').forEach(function(it){manifest[it.getAttribute('id')]={href:it.getAttribute('href')};});
  var spine=[];opf.querySelectorAll('itemref').forEach(function(n){spine.push(n.getAttribute('idref'));});
  var base=opfPath.indexOf('/')!==-1?opfPath.split('/').slice(0,-1).join('/'):'';
  var html='';
  for(var i=0;i<spine.length;i++){
    var e=manifest[spine[i]];if(!e)continue;
    var p=base?base+'/'+e.href:e.href;
    var f=zip.file(p)||zip.file(decodeURIComponent(p));if(!f)continue;
    var d=P.parseFromString(await f.async('string'),'application/xhtml+xml');
    await inlineImgs(d,zip,p);
    var body=d.querySelector('body');
    if(body) html+='<div class="chapter-break">'+body.innerHTML+'</div>';
  }
  return{title:title,html:html};
}

function recalc(){
  var cw=content.clientWidth;
  var g=parseFloat(getComputedStyle(content).columnGap)||48;
  var colW=Math.floor((cw-g)/2);
  content.style.columnWidth=colW+'px';
  void content.offsetHeight;
  var sw=content.scrollWidth;
  totalCols=Math.max(2,Math.round((sw+g)/(colW+g)));
  if(totalCols%2!==0)totalCols++;
  slider.max=totalCols;pageNumIn.max=totalCols;pageTotalS.textContent='/ '+totalCols;
  return totalCols;
}
function goCol(c){
  currentCol=Math.max(0,c);
  if(currentCol%2!==0)currentCol--;
  var maxCol=totalCols-2;if(maxCol<0)maxCol=0;
  if(currentCol>maxCol)currentCol=maxCol;
  var g=parseFloat(getComputedStyle(content).columnGap)||48;
  var colW=Math.floor((content.clientWidth-g)/2);
  content.scrollLeft=currentCol*(colW+g);
  syncUI();
}
function leftPage(){return currentCol+1;}
function syncUI(){
  var lp=leftPage();
  slider.value=lp;pageNumIn.value=lp;
  pageIndic.textContent='Page '+lp+'-'+Math.min(lp+1,totalCols)+' / '+totalCols;
}

function createColumnDiv(colW,g,cw,ch){
  var d=document.createElement('div');
  d.style.cssText='width:'+colW+'px;height:'+ch+'px;overflow:hidden;position:absolute;top:0;background:#fdfdfe;';
  var clone=content.cloneNode(true);
  clone.style.cssText='width:'+cw+'px;height:'+ch+'px;overflow:hidden;'+
    'column-gap:'+g+'px;column-width:'+colW+'px;'+
    'color:#1e293b;font-size:'+fontSize+'px;line-height:1.75;';
  d.appendChild(clone);
  return d;
}

function animateFlip(dir){
  if(animating)return;
  var nc=currentCol+(dir===1?2:-2);
  if(nc<0||nc>totalCols-2)return;
  animating=true;

  var g=parseFloat(getComputedStyle(content).columnGap)||48;
  var colW=Math.floor((content.clientWidth-g)/2);
  var cw=content.clientWidth,ch=content.clientHeight;

  var cr=content.getBoundingClientRect(),vr=viewport.getBoundingClientRect();
  var ov=document.createElement('div');
  ov.style.cssText='position:absolute;left:'+(cr.left-vr.left)+'px;top:'+(cr.top-vr.top)+
    'px;width:'+cw+'px;height:'+ch+'px;z-index:15;pointer-events:none;';
  viewport.appendChild(ov);

  var lChild=createColumnDiv(colW,g,cw,ch);
  var rChild=createColumnDiv(colW,g,cw,ch);
  lChild.style.left='0';
  rChild.style.right='0';

  var lObj=document.createElement('div');
  var rObj=document.createElement('div');
  lObj.style.cssText='position:absolute;width:1px;height:'+ch+'px;overflow:hidden;top:0;';
  rObj.style.cssText='position:absolute;width:1px;height:'+ch+'px;overflow:hidden;top:0;';
  lObj.appendChild(lChild);
  rObj.appendChild(rChild);

  if(dir===1){
    lObj.style.boxShadow='-4px 4px 8px rgba(0,0,0,.2)';
    rObj.style.right='0';
    lObj.style.left=(cw-1)+'px';
  }else{
    rObj.style.boxShadow='4px 4px 8px rgba(0,0,0,.2)';
    lObj.style.left='0';
    rObj.style.left='0';
  }

  ov.appendChild(lObj);
  ov.appendChild(rObj);

  void ov.offsetHeight;
  lChild.firstElementChild.scrollLeft=nc*(colW+g);
  rChild.firstElementChild.scrollLeft=(nc+1)*(colW+g);

  var dur=250,start=null;
  requestAnimationFrame(function frame(ts){
    if(!start)start=ts;
    var t=Math.min((ts-start)/dur,1);
    var p=t<.5?2*t*t:(1-Math.pow(-2*t+2,2)/2);
    var w=1+(colW-1)*p;
    lObj.style.width=w+'px';
    rObj.style.width=w+'px';
    if(dir===1){
      lObj.style.left=((cw-1)*(1-p))+'px';
    }else{
      rObj.style.left=((cw-colW)*p)+'px';
    }
    if(t<1){requestAnimationFrame(frame);}
    else{goCol(nc);viewport.removeChild(ov);animating=false;}
  });
}

function flipNext(){if(currentCol+2<=totalCols-2)animateFlip(1);}
function flipPrev(){if(currentCol>=2)animateFlip(-1);}

function setFont(sz){
  fontSize=Math.max(12,Math.min(32,sz));
  fontSliderEl.value=fontSize;fontLbl.textContent=fontSize;
  document.documentElement.style.setProperty('--page-fs',fontSize+'px');
  if(rawHTML){var c=currentCol;recalc();goCol(c);}
}

async function loadFile(file){
  statusMsg.textContent='Loading...';
  try{
    var r=await parseEpub(await file.arrayBuffer());
    rawHTML=r.html||'<p>No content.</p>';
    bookTitleE.textContent=r.title;document.title=r.title+' \u2014 ePub Reader';
    content.innerHTML=rawHTML;
    splash.style.display='none';
    prevBtn.style.display='';nextBtn.style.display='';
    slider.disabled=false;pageNumIn.disabled=false;goBtn.disabled=false;
    await new Promise(function(r){requestAnimationFrame(function(){requestAnimationFrame(r);});});
    currentCol=0;recalc();goCol(0);
    statusMsg.textContent='';
  }catch(e){console.error(e);statusMsg.textContent='Error: '+e.message;}
}

fileInput.addEventListener('change',function(e){var f=e.target.files[0];if(f)loadFile(f);});
slider.addEventListener('input',function(){var p=Number(slider.value);goCol(p%2===0?p-2:p-1);});
goBtn.addEventListener('click',function(){var p=Number(pageNumIn.value);goCol(p%2===0?p-2:p-1);});
pageNumIn.addEventListener('keydown',function(e){if(e.key==='Enter'){var p=Number(pageNumIn.value);goCol(p%2===0?p-2:p-1);}});
prevBtn.addEventListener('click',function(){flipPrev();});
nextBtn.addEventListener('click',function(){flipNext();});
fontDec.addEventListener('click',function(){setFont(fontSize-1);});
fontInc.addEventListener('click',function(){setFont(fontSize+1);});
fontSliderEl.addEventListener('input',function(){setFont(Number(fontSliderEl.value));});

window.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();flipNext();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();flipPrev();}
  else if(e.key==='+'||e.key==='='){e.preventDefault();setFont(fontSize+1);}
  else if(e.key==='-'){e.preventDefault();setFont(fontSize-1);}
});

window.addEventListener('wheel',function(e){
  if(e.ctrlKey){e.preventDefault();setFont(fontSize+(e.deltaY<0?1:-1));}
},{passive:false});

var tx=0;
viewport.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
viewport.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)<40)return;
  if(dx<0)flipNext();else flipPrev();
});

viewport.addEventListener('click',function(e){
  if(!totalCols)return;
  var rect=viewport.getBoundingClientRect();
  var x=e.clientX-rect.left;
  if(x<rect.width*0.15)flipPrev();
  else if(x>rect.width*0.85)flipNext();
});

var rTimer;
window.addEventListener('resize',function(){
  clearTimeout(rTimer);
  rTimer=setTimeout(function(){if(rawHTML){var c=currentCol;recalc();goCol(c);}},250);
});
})();
</script>
</body>
</html>
